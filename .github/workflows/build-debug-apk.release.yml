name: Build Debug APK and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Upgrade KSP for headless CI
        run: |
          find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 \
            | xargs -0 sed -i \
              -e 's/id[[:space:]]*(\"com.google.devtools.ksp\")[[:space:]]*version[[:space:]]*\"[^\"]*\"/id(\"com.google.devtools.ksp\") version \"2.3.7\"/g' \
              -e 's/id[[:space:]]*\x27com.google.devtools.ksp\x27[[:space:]]*version[[:space:]]*\x27[^\x27]*\x27/id(\x27com.google.devtools.ksp\x27) version \x272.3.7\x27/g'
          grep -RIn --include='build.gradle' --include='build.gradle.kts' 'com.google.devtools.ksp' . || true

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.configuration-cache=false
            -Dkotlin.incremental=false
            -Dksp.incremental=false
            -Dksp.incremental.log=false
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache -Pksp.incremental=false clean assembleDebug --stacktrace

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          TAG="debug-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smart Farm App debug APK ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --notes "Debug APK built from commit ${GITHUB_SHA}. This release asset is used instead of an Actions artifact because Actions artifact storage is currently full." \
            --latest=false
