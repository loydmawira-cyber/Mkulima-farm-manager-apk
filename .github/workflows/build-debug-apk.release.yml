name: Build Debug APK and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          TAG="debug-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smart Farm App debug APK ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --notes "Debug APK built from commit ${GITHUB_SHA}. This release asset is used instead of an Actions artifact because Actions artifact storage is currently full." \
            --latest=false
