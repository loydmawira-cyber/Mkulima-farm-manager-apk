name: Build Debug APK and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Configure headless Gradle and KSP
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          {
            echo ''
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.configuration-cache=false'
            echo 'kotlin.incremental=false'
            echo 'ksp.incremental=false'
            echo 'ksp.incremental.log=false'
            echo 'ksp.useKSP2=true'
          } >> gradle.properties
          echo 'Gradle/KSP configuration:'
          grep -E '^(org.gradle.daemon|org.gradle.parallel|org.gradle.configuration-cache|kotlin.incremental|ksp\.)' gradle.properties || true

      - name: Build Debug APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: '-Djava.awt.headless=true'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configuration-cache=false -Dkotlin.incremental=false -Dksp.incremental=false'
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache -Pksp.incremental=false -Pksp.useKSP2=true clean assembleDebug --stacktrace

      - name: Publish APK as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK_PATH"
          TAG="debug-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smart Farm App debug APK ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --notes "Debug APK built from commit ${GITHUB_SHA}. This release asset is used instead of an Actions artifact because Actions artifact storage is currently full." \
            --latest=false
