name: Build Signed Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-release-aab.yml"

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build signed Smart Farm App AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode protected upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 GitHub secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smart-farm-upload.jks"

      - name: Build signed release App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/smart-farm-upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          # The phone key used Enter for its key password, so the key alias
          # deliberately shares the keystore password saved above.
          KEY_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing STORE_PASSWORD GitHub secret"; exit 1; }
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload signed App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFarm-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/smart-farm-upload.jks"
