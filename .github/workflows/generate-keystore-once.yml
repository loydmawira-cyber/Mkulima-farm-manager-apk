name: Generate Debug Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Commit keystore to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add debug.keystore
          git commit -m "Add committed debug keystore for consistent signing"
          git push
